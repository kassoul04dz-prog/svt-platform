# إعدادات النشر على Netlify
[build]
  publish   = "public"              # الصفحة العامة (شاشة الدخول) فقط
  functions = "netlify/functions"   # الدوال

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "same-origin"
